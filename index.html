<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>MOISES BLOG</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=1280, initial-scale=1.0">
        <!-- Importando a fonte VT323 -->
        <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
        <style>
            body, html { 
                margin: 0; 
                padding: 0; 
                background-color: #000; 
                overflow: hidden; 
                min-height: 100vh; 
                display: flex;
                justify-content: center; 
                align-items: center;     
            }

            canvas {
                display: block;
                max-width: 100vw;
                max-height: 100vh;
                width: auto;
                height: auto;
                object-fit: contain; 
                image-rendering: pixelated; 
            }
        </style>
    </head>
    <body>
        <script>
            document.fonts.load('10pt "VT323"').then(() => {
                requestAnimationFrame(SiteLoop);
            });

            const WinW = 1280 * 1.5; 
            const WinH = 720 * 1.2;  
            
            const Canvas = document.createElement("canvas");
            const CanvasContext = Canvas.getContext("2d");
            
            var Time = 0;
            var LastTime = performance.now();
            var Delta = 0;
            var UsedScroll = 0;
            var Scroll = 0;
            var MaxScroll = 0; 

            Canvas.id = "SaiteCanvas";
            Canvas.width = WinW;
            Canvas.height = WinH;
            document.body.appendChild(Canvas);
            
            CanvasContext.imageSmoothingEnabled = false;

            var MouseClicked = false;
            var OldMouseClicked = false;
            var MousePos = {x: 0, y: 0};
            var OldMousePos = {x: 0, y: 0};
            var Laike = false

            Canvas.addEventListener("click", () => { MouseClicked = true; });
            Canvas.addEventListener("mousemove", (ev) => {
                const rect = Canvas.getBoundingClientRect();
                const scaleX = Canvas.width / rect.width;
                const scaleY = Canvas.height / rect.height;
                OldMousePos.x = MousePos.x;
                OldMousePos.y = MousePos.y;
                MousePos.x = (ev.clientX - rect.left) * scaleX;
                MousePos.y = (ev.clientY - rect.top) * scaleY;
            });

            Canvas.onwheel = function(ev) {
                Scroll -= ev.deltaY * 0.8; 
                Scroll = clamp(Scroll, -MaxScroll, 0);
            };

            function fillPixelText(ctx, text, x, y, color, shadowColor, offsetX, offsetY) {
                ctx.save();
                ctx.fillStyle = shadowColor;
                ctx.fillText(text, x + offsetX, y + offsetY);
                ctx.fillStyle = color;
                ctx.fillText(text, x, y);
                ctx.restore();
            }

            function fillWaveText(ctx, text, x, y, color, shadowColor, offsetX, offsetY, waveForce, waveTime) {
                ctx.save();
                let currentX = x;
                
                ctx.fillStyle = shadowColor;
                for (var i = 0; i < text.length; i++) {
                    let charY = y + waveForce * Math.sin(waveTime + (i * 0.3));
                    ctx.fillText(text[i], currentX + offsetX, charY + offsetY);
                    currentX += ctx.measureText(text[i]).width;
                }

                currentX = x; 
                ctx.fillStyle = color;
                for (var i = 0; i < text.length; i++) {
                    let charY = y + waveForce * Math.sin(waveTime + (i * 0.3));
                    ctx.fillText(text[i], currentX, charY);
                    currentX += ctx.measureText(text[i]).width;
                }
                ctx.restore();
            }

            var Buttons = [];
            class Button {
                constructor(x, y, w, h, text, pressFunc) {
                    this.x = x; this.y = y; this.w = w; this.h = h;
                    this.wAdd = 0; this.hAdd = 0;
                    this.hovered = false;
                    this.text = text; this.rot = 0;
                    this.pressFunc = pressFunc;
                    Buttons.push(this);
                }
                Update() {
                    const usedX = this.x - (this.w + this.wAdd) / 2;
                    const usedY = this.y + UsedScroll - (this.h + this.hAdd) / 2;
                    const hover = MousePos.x > usedX && MousePos.x < usedX + (this.w + this.wAdd) && MousePos.y > usedY && MousePos.y < usedY + (this.h + this.hAdd);
                    
                    if (!this.hovered && hover) { this.wAdd = this.w * 0.2; this.hAdd = this.h * 0.2; }
                    if (this.hovered && !hover) { this.wAdd = -this.w * 0.1; this.hAdd = -this.h * 0.1; }
                    
                    this.hovered = hover;
                    if (this.hovered) {
                        this.rot += (OldMousePos.x - MousePos.x) / 500;
                        if (MouseClicked && !OldMouseClicked) {
                            this.wAdd = -this.w * 0.25; this.hAdd = -this.h * 0.25;
                            this.pressFunc();
                        }
                    }
                    this.rot = lerp(this.rot, 0, 8);
                    this.wAdd = lerp(this.wAdd, 0, 8);
                    this.hAdd = lerp(this.hAdd, 0, 8);
                }
                Draw() {
                    CanvasContext.save();
                    CanvasContext.translate(this.x, this.y);
                    CanvasContext.rotate(this.rot);

                    const finalW = this.w + this.wAdd;
                    const finalH = this.h + this.hAdd;

                    CanvasContext.fillStyle = "black";
                    CanvasContext.fillRect(-finalW/2 + 8, -finalH/2 + 8, finalW, finalH);
                    
                    CanvasContext.fillStyle = this.hovered ? "white" : "black";
                    CanvasContext.fillRect(-finalW/2, -finalH/2, finalW, finalH);
                    
                    CanvasContext.lineWidth = 6;
                    CanvasContext.strokeStyle = "white";
                    CanvasContext.strokeRect(-finalW/2, -finalH/2, finalW, finalH);
                    
                    const scl = finalW / this.w;
                    CanvasContext.textAlign = "center";
                    CanvasContext.textBaseline = "middle";
                    CanvasContext.font = String(80 * scl) + "px VT323";
                    
                    fillPixelText(CanvasContext, this.text, 0, 4, (this.hovered ? "black" : "white"), "rgba(0,0,0,0.5)", 4, 4);

                    CanvasContext.restore();
                }
            }

            class Post {
                constructor(x, y, w, h, title, contentDrawFunc, customLikeCallback, customDislikeCallback) {
                    this.x = x; this.y = y; this.w = w; this.h = h;
                    this.title = title;
                    this.contentDrawFunc = contentDrawFunc;
                    this.laikes = Math.floor(9999999 * Math.random())
                    this.deslaikes = Math.floor(9999999 * Math.random())
                    this.alreadyInteracted = false
                    this.interaction = 0


                    const btnW = 160*2*1.5; 
                    const btnH = 64; 
                    const btnY = this.y + this.h - 64; 
                    const centerX = this.x + this.w / 2;
                    
                    new Button(centerX - ((btnW/2)+16), btnY, btnW, btnH, "LIKE :)", () => {
                        if (this.alreadyInteracted) {
                            if (this.interaction == 1) this.laikes --
                            if (this.interaction == -1) {
                                this.laikes ++
                                this.deslaikes --
                            }
                            this.alreadyInteracted = false
                            return
                        }
                        this.alreadyInteracted = true
                        this.interaction = 1
                        this.laikes += 1;
                        if (customLikeCallback) customLikeCallback();
                    });
                    
                    new Button(centerX + ((btnW/2)+16), btnY, btnW, btnH, "DISLIKE >:(", () => {
                        if (this.alreadyInteracted) {
                            if (this.interaction == 1) {
                                this.deslaikes ++
                                this.laikes --
                            }
                            if (this.interaction == -1) {
                                this.deslaikes --
                            }
                            this.alreadyInteracted = false
                            return
                        }
                        this.alreadyInteracted = true
                        this.interaction = -1
                        this.deslaikes += 1;
                        if (customDislikeCallback) customDislikeCallback();
                    });
                }

                Draw() {
                    CanvasContext.save();
                    
                    CanvasContext.fillStyle = "black";
                    CanvasContext.fillRect(this.x + 16, this.y + 16, this.w, this.h);

                    CanvasContext.fillStyle = "#0a0a0a"; 
                    CanvasContext.fillRect(this.x, this.y, this.w, this.h);

                    CanvasContext.lineWidth = 8;
                    CanvasContext.strokeStyle = "white";
                    CanvasContext.strokeRect(this.x, this.y, this.w, this.h);

                    CanvasContext.fillStyle = "white";
                    CanvasContext.fillRect(this.x, this.y, this.w, 80);

                    CanvasContext.textAlign = "left";
                    CanvasContext.textBaseline = "middle";
                    CanvasContext.font = "56px VT323";
                    fillWaveText(CanvasContext, this.title, this.x + 24, this.y + 40, "black", "gray", 2, 2, 8, Time);

                    if (this.contentDrawFunc) { this.contentDrawFunc(this); }

                    
                    CanvasContext.font = "40px VT323";
                    CanvasContext.textAlign = "center";
                    CanvasContext.textBaseline = "middle";
                    
                    const btnW = 160*2*1.5; 
                    const centerX = this.x + this.w / 2;
                    const btnY = this.y + this.h - 64;
                    const LaikesWidth = CanvasContext.measureText(this.laikes + " LAIKES").width;
                    const DeslaikesWidth = CanvasContext.measureText(this.deslaikes + " DESLAIKES").width;

                    
                    fillWaveText(CanvasContext, this.laikes + " LAIKES", centerX - ((btnW/2)+16) - LaikesWidth / 2, btnY - 50, "#44FF44", "black", 2, 2, 4, Time);
                    fillWaveText(CanvasContext, this.deslaikes + " DESLAIKES", centerX + ((btnW/2)+16) - DeslaikesWidth / 2, btnY - 50, "#FF4444", "black", 2, 2, 4, Time);

                    CanvasContext.restore();
                }
            }

            const EUImg = createImage("./EU.png", 407, 410);
            const EuImgHappy = createImage("./EU FELIZ.png", 407, 410);

            var WantedColorA = {r: 0.02, g: 0.01, b: 0.05}; 
            var WantedColorB = {r: 0.05, g: 0.02, b: 0.10}; 
            
            var StructColorA = {r: 0.02, g: 0.01, b: 0.05};
            var StructColorB = {r: 0.05, g: 0.02, b: 0.10};

            var PostsList = [];
            var CurrentY = 40; 
            const PostMargin = 60;
            const PostW = WinW - 160; 
            const PostX = 80;

            const AlturaSiteAntigo = 1000; 
            
            
            PostsList.push(new Post(PostX, CurrentY, PostW, AlturaSiteAntigo, "BEM VINDO AO MEU SAITE", function(post) {
                
                const ColEsquerdaX = post.x + 300;
                
                CanvasContext.textAlign = "center"; CanvasContext.textBaseline = "middle";
                const MainTextSpeedUp = 2; 
                var FontSize = 80 + 8 * Math.cos(Time * MainTextSpeedUp); 
                CanvasContext.font = String(FontSize) + "px VT323";

                const TotalRep = 8 + 4 * Math.cos(Time * MainTextSpeedUp / 2);
                for (var r=0; r<TotalRep; r++) {
                    CanvasContext.save();
                    CanvasContext.fillStyle = 'hsl(0, 0%, ' + String(100 * (r / TotalRep)) + '%)';
                    CanvasContext.translate(ColEsquerdaX + (4 * r * Math.cos(Time * MainTextSpeedUp)), post.y + 180 + FontSize + (4 * r * Math.sin(Time * MainTextSpeedUp)));
                    CanvasContext.rotate(0.1 * Math.sin(Time * MainTextSpeedUp));
                    fillPixelText(CanvasContext, "ESSE É O MEU SAITE", 0, -64, CanvasContext.fillStyle, "black", FontSize/16, FontSize/16);
                    CanvasContext.restore();
                }

                const UsedImg = Laike ? EuImgHappy : EUImg

                for (var r = 0; r < 8; r++) {
                    CanvasContext.save(); 
                    CanvasContext.translate(ColEsquerdaX, post.y + 530);
                    CanvasContext.rotate(0.05 * Math.sin(Time)); 
                    CanvasContext.scale(1 + 0.05 * Math.cos(Time), 1 + 0.05 * Math.sin(Time / 2));
                    if(UsedImg.complete) CanvasContext.drawImage(UsedImg, -UsedImg.width / 2 + r*6, -UsedImg.height / 2 - r*6);
                    CanvasContext.restore();
                }

                let ImgH = UsedImg.complete ? UsedImg.height : 400;
                
                CanvasContext.font = "40px VT323"; CanvasContext.textAlign = "center";
                fillPixelText(CanvasContext, "EU NÃO TO SENDO PRESO, OK?", ColEsquerdaX, post.y + 530 + ImgH / 2 + 30, "white", "black", 3, 3);

                CanvasContext.font = "140px VT323";
                fillPixelText(CanvasContext, "^ EU ^", ColEsquerdaX, post.y + 530 + ImgH / 2 + 120 + 16 * Math.sin(Time), "white", "black", 8, 8);

                const MEInfos = [
                    { Text: "Meu nome é Moises Henrique de Almeida", SubTxt: "Tem um acento em algum lugar mas eu não sei aonde" },
                    { Text: "Faço jogo indie ruim ja faz uns 4 anos", SubTxt: "Alguns sem game engine inclusive" },
                    { Text: "Eu desenho", SubTxt: "Não é bom" },
                    { Text: "Sei usar Godot, Allegro 5, Raylib para fazer jogos", SubTxt: "Não recomendo aprender todos >:(" },
                    { Text: "Programo em C, C++, C#, Python, JS, Zig, D, Odin", SubTxt: "Não recomendo aprender todos :)" },
                ];

                CanvasContext.textAlign = "left"; CanvasContext.textBaseline = "top"; 
                let fSize = 52; 
                CanvasContext.font = String(fSize) + "px VT323";
                var InfoY = post.y + 160; 
                let ColDireitaX = post.x + 620; 

                for (var i=0; i < MEInfos.length; i++) {
                    CanvasContext.save();
                    const CurrentInfo = MEInfos[i];
                    
                    CanvasContext.translate(ColDireitaX + 12 * Math.sin(Time + (i/2)), InfoY);

                    fillPixelText(CanvasContext, CurrentInfo.Text, 0, 0, "#FFD700", "black", 3, 3);

                    CanvasContext.font = "34px VT323";
                    var DrawnSubTxt = "(" + CurrentInfo.SubTxt + ")";
                    var EndChar = CurrentInfo.SubTxt.charAt(CurrentInfo.SubTxt.length - 1);
                    if (EndChar == ")" || EndChar == "(") { DrawnSubTxt = CurrentInfo.SubTxt; }
                    
                    fillPixelText(CanvasContext, DrawnSubTxt, 0, fSize * 0.85, "#AAAAAA", "black", 2, 2);
                    CanvasContext.restore();
                    CanvasContext.font = String(fSize) + "px VT323";
                    
                    InfoY += (fSize * 2.1);
                }

                CanvasContext.textAlign = "center"; CanvasContext.textBaseline = "middle";
                CanvasContext.font = "64px VT323";
                fillPixelText(CanvasContext, "Gostou do meu saite?", post.x + post.w / 2, post.y + post.h - 180, "white", "black", 4, 4);
            }, 
            
            
            function() { 
                WantedColorA = {r: 0.10, g: 0.40, b: 0.40}; 
                WantedColorB = {r: 0.30, g: 0.60, b: 0.80}; 
                Laike = true;
            }, 
            
            function() { 
                WantedColorA = {r: 0.50, g: 0.10, b: 0.30}; 
                WantedColorB = {r: 0.60, g: 0.30, b: 0.10}; 
                Laike = false;
            }));

            CurrentY += AlturaSiteAntigo + PostMargin; 

            const fSizeTodo = "48px VT323";
            
            
            PostsList.push(new Post(PostX, CurrentY, PostW, 400, "COMO AS PIADAS COM A SILMARA IMPACTAM CHRISTIAN FELIPE", function(post) {
                CanvasContext.font = fSizeTodo; CanvasContext.textAlign = "left"; CanvasContext.textBaseline = "top";
                fillPixelTextWrapped(CanvasContext, "CHRISTIAN FELIPE PAROU DE FALAR COM UM TAL DE DERI LULZZ POR CAUSA DE PIADAS COM A\nSILMARA, ISSO NÂO É LEGAL, MAS SIM ILEGAL", post.x + 32, post.y + 120, PostW-16, 32, "white", "black", 2, 2);
            }));
            CurrentY += 400 + PostMargin;

            
            PostsList.push(new Post(PostX, CurrentY, PostW, 400, "COMO PIADAS COM A MARTA IMPACTAM A PRODUÇÃO MUSICAL DO EUMESMO", function(post) {
                CanvasContext.font = fSizeTodo; CanvasContext.textAlign = "left"; CanvasContext.textBaseline = "top";
                fillPixelTextWrapped(CanvasContext, "EUMESMO PASSOU OS ULTIMOS 3 ANOS RECEBENDO PIADAS COM A MARTA, E NUNCA TEVE A OPORTUNIDADE DE FAZER UMA TAMBEM, MAS EU TENHO CERTEZA QUE ESSE É O SONHO DELE", post.x + 32, post.y + 120, PostW-16, 32, "white", "black", 2, 2);
            }));
            CurrentY += 400 + PostMargin;

            
            PostsList.push(new Post(PostX, CurrentY, PostW, 400, "COMO ISSO AFETA O VASCO DA GRAMA", function(post) {
                CanvasContext.font = fSizeTodo; CanvasContext.textAlign = "left"; CanvasContext.textBaseline = "top";
                fillPixelTextWrapped(CanvasContext, "EM 9999 A.C FOI CRIADO O VASCO DA GRAMA, UM TIME DE VASCAINOS FUTEBOLISTAS,\nE SEUS PRINCIPAIS JOGADORES INCLUIRAM: \"JESUS CRISTO\", \"NAPOLEÃO BONAPARTE\", \"ABRAHAM LINCOLN\", \"ZUMBI DOS PALAMARES\"", post.x + 32, post.y + 120, PostW, 32, "white", "black", 2, 2);
            }));
            CurrentY += 400 + PostMargin;

            const LastPost = PostsList[PostsList.length - 1];

            MaxScroll = Math.max(
                0,
                LastPost.y + LastPost.h + PostMargin - WinH
            );

            const Stars = [];
            for (let i = 0; i < 200; i++) {
                Stars.push({ x: Math.random() * WinW, y: Math.random() * WinH, z: Math.random() * 3 + 1 });
            }

            function DrawAestheticBackground() {
                StructColorA.r = lerp(StructColorA.r, WantedColorA.r, 3); 
                StructColorA.g = lerp(StructColorA.g, WantedColorA.g, 3); 
                StructColorA.b = lerp(StructColorA.b, WantedColorA.b, 3);
                
                StructColorB.r = lerp(StructColorB.r, WantedColorB.r, 3); 
                StructColorB.g = lerp(StructColorB.g, WantedColorB.g, 3); 
                StructColorB.b = lerp(StructColorB.b, WantedColorB.b, 3);

                const colA = `rgb(${StructColorA.r * 255}, ${StructColorA.g * 255}, ${StructColorA.b * 255})`;
                const colB = `rgb(${StructColorB.r * 255}, ${StructColorB.g * 255}, ${StructColorB.b * 255})`;
                
                const grad = CanvasContext.createLinearGradient(0, 0, 0, Canvas.height);
                grad.addColorStop(0, colA);
                grad.addColorStop(1, colB);
                
                CanvasContext.fillStyle = grad;
                CanvasContext.fillRect(0, 0, Canvas.width, Canvas.height);

                CanvasContext.fillStyle = "white";
                for (let s of Stars) {
                    let sy = s.y + (Time * 40 * s.z);
                    let screenY = (sy + UsedScroll * (s.z * 0.3)) % WinH;
                    if (screenY < 0) screenY += WinH; 
                    let size = Math.floor(s.z) * 2; 
                    CanvasContext.fillRect(Math.floor(s.x), Math.floor(screenY), size, size);
                }
            }

            function SiteLoop(CurrentTime) {
                Delta = clamp((CurrentTime - LastTime) / 1000, 0, 0.1);
                LastTime = CurrentTime;

                UsedScroll = lerp(UsedScroll, Scroll, 4);

                DrawAestheticBackground();

                CanvasContext.save();
                CanvasContext.translate(0, Math.floor(UsedScroll));

                for (let p = 0; p < PostsList.length; p++) {
                    PostsList[p].Draw();
                }

                for (var l = 0; l < Buttons.length; l++) {
                    Buttons[l].Update();
                    Buttons[l].Draw();
                }

                CanvasContext.restore(); 

                Time += 1 * Delta;
                OldMouseClicked = MouseClicked;
                MouseClicked = false;
                requestAnimationFrame(SiteLoop);
            }

            function createImage(src, width, height, alt) {
                let img = document.createElement("img");
                img.src = src; img.width = width; img.height = height; img.alt = alt;
                return img;
            }
            function clamp(num, min, max) {
                return Math.max(min, Math.min(max, num));
            }
            function lerp(a, b, t) { return a + (b - a) * (1 - Math.exp(-t * Delta)); }
            function fillPixelTextWrapped(ctx, text, x, y, maxWidth, lineHeight, color, shadowColor, shadowX = 2, shadowY = 2) {
                ctx.save();

                const words = text.split(" ");
                let line = "";
                let currentY = y;

                for (let i = 0; i < words.length; i++) {
                    const testLine = line + words[i] + " ";
                    const testWidth = ctx.measureText(testLine).width;

                    if (testWidth > maxWidth && line !== "") {
                        ctx.fillStyle = shadowColor;
                        ctx.fillText(line, x + shadowX, currentY + shadowY);

                        ctx.fillStyle = color;
                        ctx.fillText(line, x, currentY);

                        line = words[i] + " ";
                        currentY += lineHeight;
                    } else {
                        line = testLine;
                    }
                }

                ctx.fillStyle = shadowColor;
                ctx.fillText(line, x + shadowX, currentY + shadowY);

                ctx.fillStyle = color;
                ctx.fillText(line, x, currentY);

                ctx.restore();
            }

        </script>
    </body>
</html>
