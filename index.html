<!DOCTYPE html>


<html lang="pt-br">
    <head>
        <title>MOISES BLOG</title>
        <meta charset="UTF-8">
        <meta name="VIEW" content="width=1280 initial-scale=1.0">
        <link href="./style.css" rel="stylesheet" type="text/css" media="all">
    </head>
    <body>
        <script>
            const WinW = 1280*1.5
            const WinH = 720
            const Canvas = document.createElement("canvas");
            const CanvasContext = Canvas.getContext("2d")
            var Time = 0
            var LastTime = 0;
            var Delta = 0;
            var MouseX = 0;
            var MouseY = 0;
            var MousePressed = false
            var Buttons = []


            Canvas.addEventListener("click", MouseClick)
            Canvas.addEventListener("mousemove", MouseMove)
            Canvas.onwheel = function(ev) {
                Scroll = clamp(Scroll, -WinH * 4, 0)
                Scroll -= ev.deltaY;
            }


            class Button {
                constructor(x, y, w, h, text, pressFunc) {
                    this.x = x
                    this.y = y
                    this.w = w
                    this.h = h
                    this.wAdd = 0
                    this.hAdd = 0
                    this.hovered = false
                    this.text = text
                    this.rot = 0
                    this.pressFunc = pressFunc
                    Buttons.push(this)
                }
                
                
                Update() {
                    const usedX = this.x - (this.w + this.wAdd) / 2
                    const usedY = this.y - (this.h + this.hAdd) / 2
                    const hover = MousePos.x > usedX && MousePos.x < usedX + (this.w + this.wAdd) && MousePos.y > usedY && MousePos.y < usedY + (this.h + this.hAdd)
                    
                    
                    if (!this.hovered && hover) {
                        this.wAdd = this.w * 1.25
                        this.hAdd = this.h * 1.25
                    }
                    if (this.hovered && !hover) {
                        this.wAdd = -this.w * 0.25
                        this.hAdd = -this.h * 0.25
                    }
                    
                    
                    this.hovered = hover
                
                    
                    if (this.hovered) {
                        this.rot += (OldMousePos.x - MousePos.x) / 500
                        
                        
                        if (MouseClicked && !OldMouseClicked) {
                            this.wAdd = -this.w * 0.25
                            this.hAdd = -this.h * 0.25
                            this.pressFunc()
                        }
                    }
                    
                    
                    this.rot = lerp(this.rot, 0, 6)
                    this.wAdd = lerp(this.wAdd, 0, 6)
                    this.hAdd = lerp(this.hAdd, 0, 6)
                }
                
                
                Draw() {
                    CanvasContext.fillStyle = "black"
                //    CanvasContext.rotate(this.rot)
                    CanvasContext.fillRect(this.x - (this.w + this.wAdd) / 2, this.y - (this.h + this.hAdd) / 2, this.w + this.wAdd, this.h + this.hAdd)
                    CanvasContext.strokeStyle = "white"
                    CanvasContext.fillStyle = "white"
                    CanvasContext.strokeRect(this.x - (this.w + this.wAdd) / 2, this.y - (this.h + this.hAdd) / 2, this.w + this.wAdd, this.h + this.hAdd)
                    
                    
                    const scl = (this.w + this.wAdd) / this.w
                    CanvasContext.font = String(64 * scl) + "px PixelOperator";
                    CanvasContext.fillText(this.text, this.x, this.y + 16)
                //    CanvasContext.rotate(-this.rot)
                }
                }

            Canvas.id = "SaiteCanvas";
            Canvas.width = WinW;
            Canvas.height = WinH;


            document.children[0].appendChild(Canvas);
            CanvasContext.imageSmoothingEnabled = false;
            CanvasContext.filter = 'none';


            var Scroll = 0;
            var WantedScroll = 0;
            var MouseClicked = false
            var OldMouseClicked = false
            var MousePos = {x: 0, y: 0}
            var OldMousePos = {x: 0, y: 0}
            CanvasContext.lineJoin = "round"
            CanvasContext.lineWidth = 4


            function MouseClick(ev) {
                MouseClicked = true
            }
            function MouseMove(ev) {
                //EXISTEM RAZÕES DO PORQUE EU ODEIO JAVASCRIPT


                const rect = Canvas.getBoundingClientRect();

                
                const scaleX = Canvas.width / rect.width;
                const scaleY = Canvas.height / rect.height;


                OldMousePos.x = MousePos.x;
                OldMousePos.y = MousePos.y;

                
                MousePos.x = (ev.clientX - rect.left) * scaleX;
                MousePos.y = (ev.clientY - rect.top) * scaleY;
            }


            const EUImg = createImage("./EU.png", 407, 410)
            var Likes = 0


            var BgColor = "black"
            var WantedBgColor = {r: 0, g: 0, b: 0}
            var StructBgColor = {r: 0, g: 0, b: 0}


            const BtnW = 128
            const BtnH = 64
            const BtnPos = {x : WinW / 2, y : WinH - BtnH - 16}
            new Button(BtnPos.x - BtnW * 2, BtnPos.y, BtnW, BtnH, "Sim", function() {
                WantedBgColor.r = 0
                WantedBgColor.g = 1
                WantedBgColor.b = 0
            })
            new Button(BtnPos.x + BtnW * 2, BtnPos.y, BtnW, BtnH, "Não", function() {
                WantedBgColor.r = 1
                WantedBgColor.g = 0
                WantedBgColor.b = 0
            })


            function SiteLoop(CurrentTime) {
                Delta = clamp((CurrentTime - LastTime) / 1000, 0, 0.1);
                LastTime = CurrentTime;


                for (var l = 0; l < Buttons.length; l++) {
                    Buttons[l].Update();
                }


                CanvasContext.shadowOffsetX = 8
                CanvasContext.shadowOffsetY = 8
                CanvasContext.shadowColor = "black"
                CanvasContext.shadowBlur = 0


                StructBgColor.r = lerp(StructBgColor.r, WantedBgColor.r, 6)
                StructBgColor.g = lerp(StructBgColor.g, WantedBgColor.g, 6)
                StructBgColor.b = lerp(StructBgColor.b, WantedBgColor.b, 6)
                BgColor = "rgb(" + String(StructBgColor.r * 255) + "," + String(StructBgColor.g * 255) + "," + String(StructBgColor.b * 255) + ")"


                CanvasContext.fillStyle = BgColor
                CanvasContext.fillRect(0, 0, Canvas.width, Canvas.height);


                CanvasContext.translate(0, Scroll)


                const MainTextSpeedUp = 2
                var FontSize = 86 + 8 * Math.cos(Time * MainTextSpeedUp)
                CanvasContext.font = String(FontSize) + "px 'Vhs Gothic'"
                CanvasContext.textAlign = "center"
                CanvasContext.shadowOffsetX = FontSize / 16
                CanvasContext.shadowOffsetY = FontSize / 16


                const TotalRep = 10 + 5 * Math.cos(Time * MainTextSpeedUp / 2)
                for (var r=0; r<TotalRep; r++) {
                    CanvasContext.save()
                        const DrawnText = "ESSE É O MEU SAITE"
                        const TextSize = CanvasContext.measureText(DrawnText)
                        CanvasContext.fillStyle = 'hsl(0, 0%, ' + String(100 * (r / TotalRep)) + '%)'


                        CanvasContext.translate(Canvas.width / 2 + (2 * r * Math.cos(Time * MainTextSpeedUp)), FontSize + (2 * r * Math.sin(Time * MainTextSpeedUp)))
                        CanvasContext.rotate(0.1 * Math.sin(Time * MainTextSpeedUp))


                        CanvasContext.fillText(DrawnText, 0, FontSize)
                    CanvasContext.restore()
                }


                CanvasContext.font = String(32) + "px PixelOperator"
                CanvasContext.fillStyle = "white"
                CanvasContext.textAlign = "left"
                CanvasContext.shadowOffsetX = 16
                CanvasContext.shadowOffsetY = 16
                    for (var r = 0; r < 16; r++) {
                        CanvasContext.save()
                        CanvasContext.translate(256, 512)
                        CanvasContext.rotate(0.05 * Math.sin(Time))
                        CanvasContext.scale(1 + 0.05 * Math.cos(Time), 1 + 0.05 * Math.sin(Time / 2))
                            
                        
                            CanvasContext.drawImage(EUImg, -EUImg.width / 2 + r*4, -EUImg.height / 2 - r*4)
                        
                        
                        CanvasContext.restore()
                    }


                CanvasContext.shadowOffsetX = 4
                CanvasContext.shadowOffsetY = 4
                CanvasContext.fillStyle = "black"
                CanvasContext.fillText("EU NÃO TO SENDO PRESO, OK?", 8+2, 512 + EUImg.height / 2+2)
                CanvasContext.fillStyle = "white"
                CanvasContext.fillText("EU NÃO TO SENDO PRESO, OK?", 8, 512 + EUImg.height / 2)


                CanvasContext.font = String(128) + "px PixelOperator"
                CanvasContext.textAlign = "center"
                CanvasContext.shadowOffsetX = 8
                CanvasContext.shadowOffsetY = 8
                CanvasContext.fillText("^ EU ^", EUImg.width / 2, 512 + 32 + EUImg.height / 2 + 128 + 16 * Math.sin(Time))


                CanvasContext.font = String(32) + "px PixelOperator"


                const MEInfos = [
                    {
                        Text: "Meu nome é Moises Henrique de Almeida",
                        SubTxt: "Tem um acento em algum lugar mas eu não sei aonde",
                    },
                    {
                        Text: "Faço jogo indie ruim ja faz uns 4 anos",
                        SubTxt: "Sem game engine inclusive",
                    },
                    {
                        Text: "Eu desenho",
                        SubTxt: "Não é bom",
                    },
                    {
                        Text: "Sei como usar Game Maker, Godot, Allegro 5, Raylib e SFML para fazer jogos",
                        SubTxt: "Não recomendo aprender todos >:(",
                    },
                    {
                        Text: "Sei como programar em C, C++, C#, Python, Javascript, Zig, D e Odin",
                        SubTxt: "Não recomendo aprender todos :)",
                    },
                ]


                CanvasContext.textAlign = "center"
                var CurrentY = Canvas.height / 4;
                for (var i=0; i < MEInfos.length; i++) {
                    CanvasContext.save()


                    const CurrentInfo = MEInfos[i]


                    var TextMes = CanvasContext.measureText(CurrentInfo.Text)
                    var FontSize = 45 * (Canvas.width / 2) / TextMes.width
                    CanvasContext.font = String(FontSize) + "px PixelOperator"
                    TextMes = CanvasContext.measureText(CurrentInfo.Text)
                    CurrentY += (clamp(FontSize, 64+32, 128+64))
                    CanvasContext.translate(Canvas.width - TextMes.width / 2 - 16 + 16 * Math.sin(Time + (i/2)), CurrentY)


                    CanvasContext.shadowOffsetX = FontSize / 16
                    CanvasContext.shadowOffsetY = FontSize / 16


                    CanvasContext.fillText(CurrentInfo.Text, 0, 0)


                    CanvasContext.font = String(32) + "px PixelOperator"
                    var DrawnSubTxt = "(" + CurrentInfo.SubTxt + ")"


                    var EndChar = CurrentInfo.SubTxt.charAt(CurrentInfo.SubTxt.length - 1)
                    if (EndChar == ")" || EndChar == "(") {DrawnSubTxt = CurrentInfo.SubTxt}


                    CanvasContext.shadowOffsetX = 2
                    CanvasContext.shadowOffsetY = 2


                    CanvasContext.fillText(DrawnSubTxt, 0, 32)


                    CanvasContext.restore()
                }


                CanvasContext.shadowOffsetX = 2
                CanvasContext.shadowOffsetY = 2
                CanvasContext.fillStyle = "white"
                CanvasContext.fillText("Gostou do meu saite?", BtnPos.x, BtnPos.y + Number(CanvasContext.font.substring(0, CanvasContext.font.indexOf("px"))) / 2)


                CanvasContext.shadowOffsetX = 8
                CanvasContext.shadowOffsetY = 8


                for (var l = 0; l < Buttons.length; l++) {
                    Buttons[l].Draw();
                }


                CanvasContext.translate(0, -Scroll)


                Time += 1 * Delta
                OldMouseClicked = MouseClicked
                MouseClicked = false
                requestAnimationFrame(SiteLoop)
            }


            //Funções pra me ajudar a não ficar louco


            function createImage(src, width, height, alt) {
                let img = document.createElement("img");


                img.src = src;
                img.width = width;
                img.height = height;
                img.alt = alt;


                return img;
            }
            function clamp(num, min, max) {
                return num <= min
                ? min
                : num >= max
                ? max
                : num
            }
            function lerp(A, B, Force) {
                return A + (B - A) * (1 - Math.exp(-Force * Delta));
            }


            requestAnimationFrame(SiteLoop)
        </script>
    </body>
</html>
